    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body, html {
    width: 100%;
    height: 100%;
    overflow: hidden; /* Non-scrollable */
    background-color: #030303; /* Deep dark background */
    font-family: 'Inter', sans-serif;
    color: #ffffff;
}

/* Canvas background */
#canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* Centered content wrapper */
.content-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    pointer-events: none; /* Allows mouse interactions to pass through to the canvas */
}

.content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 2rem;
}

/* Logo styling */
.logo {
    max-width: 380px;
    width: 100%;
    height: auto;
    /* Use negative margins to counteract the massive empty space inside the 2500x2500 SVG */
    margin-top: -150px;
    margin-bottom: -150px;
    animation: fadeInDown 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    opacity: 0;
    /* Optional glow effect */
    filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.15));
}

/* Typography */
.title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(180deg, #ffffff 0%, #a3a3a3 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
    opacity: 0;
}

.subtitle {
    font-size: 1.1rem;
    font-weight: 400;
    color: #888888;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
    opacity: 0;
}

/* Animations */
@keyframes fadeInDown {
    from {
        opacity: 0;
        transform: translateY(-30px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .title {
        font-size: 2.0rem;
    }
    .logo {
        max-width: 220px;
    }
    .subtitle {
        font-size: 0.9rem;
    }
}

</style>
